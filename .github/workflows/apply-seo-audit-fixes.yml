name: Apply SEO audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-seo-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch official AdonisIQ app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, urllib.request
          from io import BytesIO
          from PIL import Image

          lookup = 'https://itunes.apple.com/lookup?id=6798106536&country=us'
          with urllib.request.urlopen(lookup, timeout=30) as r:
              data = json.load(r)
          if not data.get('results'):
              raise SystemExit('App Store lookup returned no AdonisIQ result')
          art = data['results'][0].get('artworkUrl512') or data['results'][0].get('artworkUrl100')
          if not art:
              raise SystemExit('No App Store artwork URL returned')
          art = art.replace('100x100bb', '512x512bb')
          with urllib.request.urlopen(art, timeout=30) as r:
              raw = r.read()
          im = Image.open(BytesIO(raw)).convert('RGB')
          im.save('adonisiq-app-icon.png', 'PNG', optimize=True)
          if im.width < 112 or im.height < 112:
              raise SystemExit(f'Icon too small: {im.size}')
          print('Saved official icon:', im.size)
          PY

      - name: Apply canonical, metadata, visual, and Organization fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, json, re
          from urllib.parse import quote

          BASE = 'https://adonisiq.app'
          APP_STORE = 'https://apps.apple.com/us/app/adonisiq-ai-fitness-coach/id6798106536'
          SAME_AS = [
              'https://www.instagram.com/adonisiq_app/',
              APP_STORE,
              'https://github.com/jstra01-cyber/Adonis',
          ]
          org = {
              '@context': 'https://schema.org',
              '@type': 'Organization',
              'name': 'AdonisIQ',
              'url': BASE + '/',
              'logo': BASE + '/adonisiq-app-icon.png',
              'sameAs': SAME_AS,
          }
          ORG_SCRIPT = '<script type="application/ld+json" id="adonisiq-org-schema">' + json.dumps(org, separators=(',', ':')) + '</script>'

          titles = {
              'faq/index.html': 'AdonisIQ FAQ — Fitness & App Help',
              'support/index.html': 'AdonisIQ Support — Account & App Help',
          }
          descriptions = {
              'android/index.html': 'Join the AdonisIQ Android early-access list, get launch updates, and volunteer to beta test the app before the public Android release.',
              'faq/index.html': 'Find AdonisIQ help for coaching, workouts, nutrition, recovery, Apple Health, subscriptions, privacy, Android access, and common setup questions.',
              'ASC_faq.html': 'Read AdonisIQ answers about coaching, nutrition, training, recovery, Apple Health, subscriptions, privacy, account setup, and Android early access.',
          }

          def canonical_for(path: Path):
              rel = path.as_posix()
              if rel == 'index.html':
                  return BASE + '/'
              if path.name.lower() == 'index.html':
                  parent = quote(path.parent.as_posix(), safe='/')
                  return f'{BASE}/{parent}/'
              return f'{BASE}/{quote(rel, safe="/")}'

          def set_title(text, value):
              if re.search(r'<title>.*?</title>', text, flags=re.I|re.S):
                  return re.sub(r'<title>.*?</title>', f'<title>{html.escape(value)}</title>', text, count=1, flags=re.I|re.S)
              return text.replace('</head>', f'<title>{html.escape(value)}</title>\n</head>', 1)

          def set_description(text, value):
              tag = f'<meta name="description" content="{html.escape(value, quote=True)}">'
              pat = re.compile(r'<meta\b(?=[^>]*\bname=["\']description["\'])[^>]*>', re.I)
              if pat.search(text):
                  return pat.sub(tag, text, count=1)
              m = re.search(r'</title>', text, flags=re.I)
              if m:
                  return text[:m.end()] + '\n' + tag + text[m.end():]
              return text.replace('</head>', tag + '\n</head>', 1)

          def normalize_canonical(text, url):
              pat = re.compile(r'<link\b(?=[^>]*\brel=["\']canonical["\'])[^>]*>\s*', re.I)
              text = pat.sub('', text)
              tag = f'<link rel="canonical" href="{url}">'
              m = re.search(r'<meta\b(?=[^>]*\bname=["\']viewport["\'])[^>]*>', text, flags=re.I)
              if m:
                  return text[:m.end()] + '\n' + tag + text[m.end():]
              return text.replace('<head>', '<head>\n' + tag, 1)

          def normalize_org(text):
              script_pat = re.compile(r'<script\b(?=[^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>', re.I|re.S)
              def keep(m):
                  body = m.group(1)
                  if '"@type":"Organization"' in body or '"@type": "Organization"' in body or "'@type': 'Organization'" in body:
                      return ''
                  if 'id="adonisiq-org-schema"' in m.group(0) or "id='adonisiq-org-schema'" in m.group(0):
                      return ''
                  return m.group(0)
              text = script_pat.sub(keep, text)
              return text.replace('</head>', ORG_SCRIPT + '\n</head>', 1)

          def add_faq_visual(text):
              marker = 'id="seo-faq-visual"'
              if marker in text:
                  return text
              css = '''\n.faqVisual{max-width:760px;margin:0 auto 34px;padding:0 18px;text-align:center}.faqVisual img{width:min(100%,420px);height:auto;margin:0 auto;border-radius:28px;border:1px solid #30333b;box-shadow:0 24px 70px rgba(0,0,0,.38)}\n'''
              text = text.replace('</style>', css + '</style>', 1)
              block = '''\n<section class="faqVisual" id="seo-faq-visual" aria-label="AdonisIQ app example"><img src="/01.png" loading="lazy" width="1179" height="2556" alt="AdonisIQ Today screen showing the daily AdonisIQ Score and coaching summary"></section>\n'''
              return text.replace('</header>', '</header>' + block, 1)

          def add_asc_visual(text):
              marker = 'id="seo-faq-visual"'
              if marker in text:
                  return text
              css = '''\n  .faq-visual { text-align:center; margin:24px 0 30px; }\n  .faq-visual img { width:min(100%,360px); height:auto; border-radius:24px; border:1px solid #d8d0bd; box-shadow:0 18px 50px rgba(0,0,0,.16); }\n'''
              text = text.replace('</style>', css + '</style>', 1)
              block = '''\n  <div class="faq-visual" id="seo-faq-visual"><img src="/01.png" loading="lazy" width="1179" height="2556" alt="AdonisIQ Today screen showing the daily AdonisIQ Score and coaching summary"></div>\n'''
              anchor = '  <div class="toc">'
              return text.replace(anchor, block + '\n' + anchor, 1)

          pages = sorted(Path('.').rglob('*.html'))
          if not pages:
              raise SystemExit('No HTML pages found')

          for path in pages:
              rel = path.as_posix()
              text = path.read_text(encoding='utf-8')
              original = text
              text = normalize_canonical(text, canonical_for(path))
              text = normalize_org(text)
              if rel in titles:
                  text = set_title(text, titles[rel])
              if rel in descriptions:
                  text = set_description(text, descriptions[rel])
              if rel == 'faq/index.html':
                  text = add_faq_visual(text)
              if rel == 'ASC_faq.html':
                  text = add_asc_visual(text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('Updated', rel, 'canonical=', canonical_for(path))

          # Audit title/description lengths without changing passing pages.
          for path in pages:
              text = path.read_text(encoding='utf-8')
              tm = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
              dm = re.search(r'<meta\b(?=[^>]*\bname=["\']description["\'])[^>]*\bcontent=["\']([^"\']*)["\'][^>]*>', text, re.I)
              title = re.sub(r'\s+', ' ', tm.group(1)).strip() if tm else ''
              desc = dm.group(1).strip() if dm else ''
              print(f'{path.as_posix()}: title={len(title)} desc={len(desc)}')
          PY

      - name: Commit SEO fixes
        run: |
          if git diff --quiet && git ls-files --error-unmatch adonisiq-app-icon.png >/dev/null 2>&1; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' adonisiq-app-icon.png
          git commit -m "Apply SEO audit canonical metadata schema and visual fixes"
          git push origin main
