name: Complete metadata audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-metadata-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix remaining title and description lengths
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, re

          titles = {
              'about/index.html': 'AdonisIQ About — Founder & Product Story',
              'download/index.html': 'AdonisIQ Download — iPhone & Android Access',
              'privacy/index.html': 'AdonisIQ Privacy Policy — Data & Health Info',
              'terms/index.html': 'AdonisIQ Terms of Use — App & Subscription Rules',
          }
          descriptions = {
              'Android/Index.html': 'Join the AdonisIQ Android early-access list, get launch updates, and volunteer to beta test the app before the public Android release.',
              'compare/index.html': 'Compare AdonisIQ with basic fitness tracking to see how training, nutrition, recovery, body trends, and AI coaching are connected in one workflow.',
              'download/index.html': 'Download AdonisIQ for iPhone from the App Store, join Android early access, or choose the right destination automatically from your current device.',
              'privacy/index.html': 'Read the AdonisIQ Privacy Policy covering account, fitness and health data, Apple Health, Health Connect, analytics, AI processing, retention, and deletion.',
              'terms/index.html': 'Read the AdonisIQ Terms of Use covering subscriptions, fitness and AI guidance, account responsibilities, health disclaimers, acceptable use, and limitations.',
          }

          def set_title(text, value):
              return re.sub(r'<title>.*?</title>', f'<title>{html.escape(value)}</title>', text, count=1, flags=re.I|re.S)

          def set_desc(text, value):
              tag = f'<meta name="description" content="{html.escape(value, quote=True)}">'
              pat = re.compile(r'<meta\b(?=[^>]*\bname=["\']description["\'])[^>]*>', re.I)
              if pat.search(text):
                  return pat.sub(tag, text, count=1)
              m = re.search(r'</title>', text, flags=re.I)
              return text[:m.end()] + '\n' + tag + text[m.end():] if m else text

          for rel, value in titles.items():
              p = Path(rel); text = p.read_text(encoding='utf-8'); new = set_title(text, value)
              if new != text: p.write_text(new, encoding='utf-8'); print('Title', rel, len(value))
          for rel, value in descriptions.items():
              p = Path(rel); text = p.read_text(encoding='utf-8'); new = set_desc(text, value)
              if new != text: p.write_text(new, encoding='utf-8'); print('Description', rel, len(value))
          PY

      - name: Commit remaining metadata fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/index.html download/index.html privacy/index.html terms/index.html Android/Index.html compare/index.html
          git commit -m "Complete site-wide SEO title and description fixes"
          git push origin main
