<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="canonical" href="https://adonisiq.app/download/">
<title>Download AdonisIQ</title>
<meta name="description" content="Download AdonisIQ for iPhone or join Android early access.">
<meta name="theme-color" content="#090a0d">
<style>
:root{
  --bg:#090a0d;--panel:#14161b;--text:#f5f4ef;--muted:#a7a9b1;
  --gold:#d4ab28;--gold2:#f0c84c;--line:#2a2d34;--max:760px
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(800px 500px at 50% -10%,rgba(212,171,40,.16),transparent 60%),var(--bg);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.wrap{width:min(var(--max),calc(100% - 34px));padding:44px 0;text-align:center}
.brand{font-weight:900;font-size:22px;margin-bottom:26px}
.eyebrow{color:var(--gold2);font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(42px,8vw,66px);line-height:1;letter-spacing:-.05em;margin:12px 0 14px}
.lead{color:#b7b9c0;font-size:18px;max-width:620px;margin:0 auto 28px}
.card{
  background:linear-gradient(180deg,#17191f,#111318);
  border:1px solid var(--line);border-radius:26px;padding:24px;margin:0 auto;
}
.status{color:#a9abb3;margin-bottom:18px;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  display:flex;align-items:center;justify-content:center;min-height:56px;
  border-radius:999px;padding:14px 18px;font-weight:900;text-decoration:none
}
.apple{background:linear-gradient(135deg,var(--gold2),#b98c10);color:#111}
.android{background:#16181e;border:1px solid #343740;color:#fff}
.note{margin-top:16px;color:#838690;font-size:13px}
.home{display:inline-block;margin-top:20px;color:#aeb0b7;text-decoration:none}
.home:hover{color:#fff}
.hidden{display:none!important}
@media(max-width:600px){.actions{grid-template-columns:1fr}.card{padding:20px}}
</style>
<script type="module" src="/heycatch-analytics.js"></script>
<script type="application/ld+json" id="adonisiq-org-schema">{"@context":"https://schema.org","@type":"Organization","name":"AdonisIQ","url":"https://adonisiq.app/","logo":"https://adonisiq.app/adonisiq-app-icon.png","sameAs":["https://www.instagram.com/adonisiq_app/","https://apps.apple.com/us/app/adonisiq-ai-fitness-coach/id6798106536","https://github.com/jstra01-cyber/Adonis"]}</script>
</head>
<body>
<main class="wrap">
<div class="brand">AdonisIQ</div>
<div class="eyebrow">Get the app</div>
<h1>One link. The right destination.</h1>
<p class="lead">We’ll send you to the best AdonisIQ destination for your device.</p>

<div class="card">
  <div id="status" class="status">Checking your device…</div>

  <div id="fallback" class="actions hidden">
    <a class="btn apple" href="https://apps.apple.com/us/app/adonisiq/id6798106536">Download for iPhone</a>
    <a class="btn android" href="/android/">Android Early Access</a>
  </div>

  <div class="note">If you aren’t redirected automatically, choose your device above.</div>
</div>

<a class="home" href="/">← Back to adonisiq.app</a>
</main>

<script>
(function(){
  const APP_STORE = "https://apps.apple.com/us/app/adonisiq/id6798106536";
  const ANDROID = "/android/";

  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  const platform = navigator.platform || "";
  const maxTouchPoints = navigator.maxTouchPoints || 0;

  const isAndroid = /android/i.test(ua);
  const isIOS =
    /iPad|iPhone|iPod/.test(ua) ||
    (platform === "MacIntel" && maxTouchPoints > 1);

  const status = document.getElementById("status");
  const fallback = document.getElementById("fallback");

  function showFallback(message){
    status.textContent = message;
    fallback.classList.remove("hidden");
  }

  if (isIOS) {
    status.textContent = "Opening AdonisIQ in the App Store…";
    fallback.classList.remove("hidden");
    setTimeout(function(){ window.location.replace(APP_STORE); }, 350);
  } else if (isAndroid) {
    status.textContent = "Opening AdonisIQ Android Early Access…";
    fallback.classList.remove("hidden");
    setTimeout(function(){ window.location.replace(ANDROID); }, 350);
  } else {
    showFallback("Choose your device:");
  }
})();
</script>
</body>
</html>
